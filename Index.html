<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What Should I Do?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="glass-card">

        <div class="logo">✨</div>

        <h1>What Should I Do?</h1>

        <p class="subtitle">
            Feeling bored? Let's find something fun, useful, or creative to do.
        </p>

        <section class="section">

            <h2>What are you in the mood for?</h2>

            <p id="result" class="result">
                <span class="result-label">✨ Your idea will appear here</span>
                <span class="result-text">Choose an option below 👇</span>
            </p>

            <button
                id="another-idea"
                class="another-button"
                onclick="giveAnotherIdea()"
                style="display: none;">
                🔄 Give Me Another Idea
            </button>

            <div class="buttons">

                <button onclick="selectMood('Entertainment')">
                    🎮 Entertainment
                </button>

                <button onclick="selectMood('Study')">
                    📚 Study
                </button>

                <button onclick="selectMood('Learn Something')">
                    💡 Learn Something
                </button>

                <button onclick="selectMood('Create Something')">
                    🎨 Create Something
                </button>

            </div>

        </section>

        <section id="time-section" class="time-section">

            <h3>How much time do you have?</h3>

            <p class="time-subtitle">
                Pick the amount of time you have right now.
            </p>

            <div class="buttons">

                <button onclick="showRecommendation('10 Minutes')">
                    ⏱️ 10 Minutes
                </button>

                <button onclick="showRecommendation('30 Minutes')">
                    ⏱️ 30 Minutes
                </button>

                <button onclick="showRecommendation('1 Hour')">
                    ⏱️ 1 Hour
                </button>

                <button onclick="showRecommendation('2+ Hours')">
                    ⏱️ 2+ Hours
                </button>

            </div>

        </section>

        <footer>
            Made to help you find something worth doing. ✨
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
